name: Release

# Tag a version (scripts/release.sh 0.2.0 → git push --follow-tags) and this builds the desktop
# app for macOS, Windows and Linux, then attaches the archives to a GitHub release.
on:
  push:
    tags: ['v*']
  # Manual rebuilds without cutting a new tag (artifacts only, no GitHub release).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            archive: zip
          - os: macos-13
            label: macos-x64
            archive: zip
          - os: windows-latest
            label: windows-x64
            archive: zip
          - os: ubuntu-22.04
            label: linux-x64
            archive: tar
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build app (stable channel)
        working-directory: apps/desktop
        env:
          # Set these repository secrets to enable signing/notarisation; without them the mac
          # build is unsigned and users install with scripts/install-mac.sh.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm exec electrobun prepare
          pnpm exec vite build
          pnpm exec electrobun build --env=stable
      - name: Package artifact
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          OUT=$(ls -d build/stable-* | head -1)
          NAME="neon-video-studio-${GITHUB_REF_NAME//\//-}-${{ matrix.label }}"
          mkdir -p ../../release
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$OUT" && zip -qry "../../../../release/${NAME}.zip" .)
          else
            tar -C "$OUT" -czf "../../release/${NAME}.tar.gz" .
          fi
          ls -la ../../release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Neon Video Studio $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "macOS builds are unsigned: install with \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install-mac.sh | bash\`"
