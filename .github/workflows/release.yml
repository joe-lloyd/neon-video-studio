name: Release

# Tag a version (scripts/release.sh 0.2.0 → git push --follow-tags) and this builds the desktop
# app for macOS, Windows and Linux, then attaches the archives to a GitHub release.
on:
  push:
    tags: ['v*']
  # Manual rebuilds without cutting a new tag (artifacts only, no GitHub release).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            archive: zip
          - os: macos-15-intel
            label: macos-x64
            archive: zip
          - os: windows-latest
            label: windows-x64
            archive: zip
          - os: ubuntu-24.04   # Cottontail's linux binary needs glibc ≥ 2.38
            label: linux-x64
            archive: tar
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build app (stable channel)
        working-directory: apps/desktop
        env:
          # Set these repository secrets to enable signing/notarisation; without them the mac
          # build is unsigned and users install with scripts/install-mac.sh.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm exec electrobun prepare
          pnpm exec vite build
          pnpm exec electrobun build --env=stable
      - name: Package artifact
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          OUT=$(ls -d build/stable-* | head -1)
          NAME="neon-video-studio-${GITHUB_REF_NAME//\//-}-${{ matrix.label }}"
          mkdir -p ../../release
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "$OUT" && 7z a -bso0 "../../../../release/${NAME}.zip" .)   # windows runners ship 7z, not zip
          elif [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$OUT" && zip -qry "../../../../release/${NAME}.zip" .)
          else
            tar -C "$OUT" -czf "../../release/${NAME}.tar.gz" .
          fi
          ls -la ../../release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    # Publish whatever platforms succeeded — one broken platform must never block the release.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No platform build produced an artifact — not creating a release."
            exit 1
          fi
          ls -la release
          {
            echo "## Install"
            echo
            echo "**macOS** (unsigned build — the script clears Gatekeeper quarantine and ad-hoc signs):"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install-mac.sh | bash"
            echo '```'
            echo
            echo "**Windows / Linux:** download the archive below and unpack; run the launcher inside."
            echo
            echo "## Artifacts in this release"
            for f in "${files[@]}"; do echo "- \`$(basename "$f")\`"; done
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "Neon Video Studio $GITHUB_REF_NAME" \
            --notes-file notes.md
