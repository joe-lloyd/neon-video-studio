<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agent and app</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(1200px 700px at 20% 10%, #2a0f22, #09090b 70%); font-family: Inter, -apple-system, sans-serif; }
  .term { position: absolute; left: 16px; top: 16px; bottom: 16px; width: 470px; border-radius: 12px; background: #0b0b10; box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(0,243,255,.25); overflow: hidden; display: flex; flex-direction: column; }
  .bar { height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: #15151b; color: #a1a1aa; font-size: 12px; flex: none; }
  .dot { width: 11px; height: 11px; border-radius: 50%; } .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .title { flex: 1; text-align: center; margin-right: 46px; font-family: "JetBrains Mono", Menlo, monospace; }
  pre { margin: 0; padding: 14px 16px; flex: 1; overflow: hidden; font: 13.5px/1.45 "JetBrains Mono", "SF Mono", Menlo, monospace; color: #d4d4d8; white-space: pre-wrap; word-break: break-all; }
  .prompt { color: #ff007f; } .cmd { color: #fff; } .out { color: #a1a1aa; } .ok { color: #39ff14; } .id { color: #00f3ff; }
  .caret { display: inline-block; width: 8px; height: 16px; background: #00f3ff; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .app { position: absolute; left: 502px; top: 16px; width: 922px; height: 778px; overflow: clip; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,0,127,.35); }
  iframe { border: 0; width: 1280px; height: 1080px; transform: scale(0.7203); transform-origin: 0 0; background: #09090b; }
</style>
</head>
<body>
<div class="term"><div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title" id="title">agent — zsh</span></div><pre id="out"></pre></div>
<div class="app"><iframe id="app"></iframe></div>
<script>
  document.getElementById("app").src = new URLSearchParams(location.search).get("app");
  const out = document.getElementById("out");
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let caret;
  function prompt() { caret?.remove(); out.insertAdjacentHTML("beforeend", '<span class="prompt">❯ </span>'); caret = document.createElement("span"); caret.className = "caret"; out.appendChild(caret); }
  window.term = {
    clear: () => { out.innerHTML = ""; prompt(); },
    async type(cmd, ms = 30) {
      const span = document.createElement("span"); span.className = "cmd"; out.insertBefore(span, caret);
      for (const ch of cmd) { span.textContent += ch; await new Promise((r) => setTimeout(r, ms)); }
    },
    // Output keeps the CLI's own text; ids and ticks are coloured so they read at a glance.
    print(text) {
      caret?.remove();
      const html = esc(text.replace(/\n$/, "")).replace(/\b(clip_[0-9a-f]{6,})/g, '<span class="id">$1</span>').replace(/^(✓|ok\b)/gm, '<span class="ok">$1</span>');
      out.insertAdjacentHTML("beforeend", "\n" + '<span class="out">' + html + "</span>\n");
      prompt();
      out.scrollTop = out.scrollHeight;
    },
    prompt,
  };
  prompt();
</script>
</body>
</html>
